body{margin:0;background:var(--bg);color:var(--tx);font-family:"Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif;line-height:1.6}

.sp{flex:1}.sec{max-width:1000px;margin:auto;padding:20px 14px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}

.tree ul{list-style:none;margin:0 0 0 14px;padding-left:14px;border-left:2px solid var(--bd)}.tree{overflow-x:auto}

.gal{columns:3 150px;gap:10px}.gal img{width:100%;border-radius:12px;margin-bottom:10px;display:block}
.ev{display:flex;justify-content:space-between;align-items:center;gap:10px}.cd{color:var(--ac);font-weight:700;white-space:nowrap}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

return`<div class=hero><div><h1>COUSIN 2026 ❤️</h1><p>${t("msg")}</p>${role?"":`<button class=pri onclick="lg()">${t("login")}</button>`}</div></div><div class=sec><h2>${t("upc")}</h2>${up.length?up.map(e=>`<div class="card ev"><span><b>${e.title}</b><br><small>${e.date}</small></span><span class=cd>${cdTxt(e.n)}</span></div>`).join(""):"—"}<h2>${t("not")}</h2>${S.notices.slice(-2).reverse().map(n=>`<div class=card><b>${n.title}</b><br><small>${n.date}</small></div>`).join("")}</div>`}
function Mm(){const l=S.members.filter(m=>(m.name+m.rel+m.loc+m.occ).toLowerCase().includes(q.toLowerCase()));
return`<div class=sec><div class=row><input style="flex:1" placeholder="${t("search")}" value="${q}" oninput="q=this.value;Rl()">${role=="a"?`<button class=pri onclick="mf()">${t("add")}</button>`:""}</div><div class=grid id=gr>${ml(l)}</div></div>`}
const ml=l=>l.map(m=>`<div class="card mc" onclick="prof(${m.id})">${av(m)}<b>${m.name}</b><small>${m.rel}</small><small>📍 ${m.loc||"-"}</small></div>`).join("");
function Rl(){document.getElementById("gr").innerHTML=ml(S.members.filter(m=>(m.name+m.rel+m.loc+m.occ).toLowerCase().includes(q.toLowerCase())))}
function prof(id){const m=S.members.find(x=>x.id==id),p=S.members.find(x=>x.id==m.p);
M(`<div style="text-align:center">${av(m).replace("class=av",'class=av style="width:96px;height:96px;margin:auto;font-size:2.5rem"')}<h3>${m.name}</h3><small>${m.rel}${p?" · "+p.name+"-এর সন্তান/Child of":""}</small></div><p>🎂 ${m.dob||"-"}<br>💼 ${m.occ||"-"}<br>📍 ${m.loc||"-"}<br>📞 ${m.ct||"-"}</p><p>${m.bio||""}</p><div class=row>${role=="a"||me?.mid==id?`<button class=pri onclick="mf(${id})">${t("edit")}</button>`:""}${role=="a"?`<button onclick="dm(${id})">🗑 ${t("del")}</button>`:""}<button onclick="M()">✕</button></div>`)}
let ph="";
function mf(id){const m=S.members.find(x=>x.id==id)||{};ph=m.ph||"";
M(`<h3>${id?t("edit"):t("add")}</h3><input id=fn placeholder="Name" value="${m.name||""}"><input id=fr placeholder="Relation (Cousin, Uncle...)" value="${m.rel||""}"><select id=fp><option value=0>— Parent / বাবা-মা (none) —</option>${S.members.filter(x=>x.id!=id).map(x=>`<option value=${x.id} ${x.id==m.p?"selected":""}>${x.name}</option>`).join("")}</select><input id=fd type=date value="${m.dob||""}"><input id=fo placeholder="Occupation" value="${m.occ||""}"><input id=fl placeholder="Location" value="${m.loc||""}"><input id=fc placeholder="Contact" value="${m.ct||""}"><textarea id=fb placeholder="Short bio">${m.bio||""}</textarea><input type=file accept="image/*" onchange="img(this.files[0],300,d=>ph=d)"><div class=row><button class=pri onclick="sm(${id||0})">${t("save")}</button><button onclick="M()">${t("cancel")}</button></div>`)}
function sm(id){if(role!="a"&&me?.mid!=id)return;if(!fn.value.trim())return alert("Name?");const o=clean({name:fn.value,rel:fr.value,p:+fp.value,dob:fd.value,occ:fo.value,loc:fl.value,ct:fc.value,bio:fb.value,ph});
if(id)Object.assign(S.members.find(x=>x.id==id),o);else S.members.push({id:nid(S.members),...o});sv();M();R()}
function dm(id){if(role!="a"||!confirm("Delete?"))return;S.members.forEach(x=>{if(x.p==id)x.p=0});S.members=S.members.filter(x=>x.id!=id);sv();M();R()}
function T(){const nd=m=>{const k=S.members.filter(x=>x.p==m.id);return`<li><div class=tn onclick="prof(${m.id})">${av(m)}<span><b>${m.name}</b><br><small>${m.rel}</small></span></div>${k.length?`<ul>${k.map(nd).join("")}</ul>`:""}</li>`};
const roots=S.members.filter(m=>!m.p||!S.members.find(x=>x.id==m.p));return`<div class=sec><h2>🌳 ${t("tree")}</h2><div class="card tree"><ul style="border:0;margin:0;padding:0">${roots.map(nd).join("")}</ul></div></div>`}
function G(){const ys=[...new Set(S.gallery.map(g=>g.y))];return`<div class=sec><h2>📸 ${t("gal")}</h2><div class=row><select style="width:auto" onchange="gy=this.value;R()"><option value="">${t("all")}</option>${ys.map(y=>`<option ${y==gy?"selected":""}>${y}</option>`).join("")}</select><input id=gc style="flex:1" placeholder="Event / caption"><input id=gyr style="width:90px" value="2026"><label class="btn pri">${t("up")}<input type=file accept="image/*" hidden onchange="img(this.files[0],900,d=>{S.gallery.push({id:nid(S.gallery),src:d,cap:esc(gc.value),y:esc(gyr.value||'2026')});sv();R()})"></label></div><br><div class=gal>${S.gallery.filter(g=>!gy||g.y==gy).map(g=>`<div><img src="${g.src}"><small>${g.cap} · ${g.y} ${role=="a"?`<a href="#" onclick="S.gallery=S.gallery.filter(x=>x.id!=${g.id});sv();R();return false">🗑</a>`:""}</small></div>`).join("")}</div></div>`}
function E(){const ev=[...S.events.map(e=>({t:"🎉 "+e.title,d:e.date,n:Math.round((new Date(e.date)-new Date(new Date().toDateString()))/864e5),once:1})),...S.members.filter(m=>m.dob).map(m=>({t:"🎂 "+m.name,d:m.dob,n:nextB(m.dob)}))].filter(e=>e.n>=0).sort((a,b)=>a.n-b.n);
return`<div class=sec><h2>🎂 ${t("ev")}</h2>${ev.map(e=>`<div class="card ev" style="margin-bottom:8px"><span><b>${e.t}</b><br><small>${e.d}</small></span><span class=cd>${cdTxt(e.n)}</span></div>`).join("")}</div>`}
function Me(){return`<div class=sec><h2>❤️ ${t("memo")}</h2><div class=grid>${S.memos.map(x=>`<div class=card><b>${x.title}</b><p>${x.text}</p></div>`).join("")}</div>${role?`<br><div class=card><input id=mt placeholder="Title"><textarea id=mx placeholder="Story..."></textarea><button class=pri onclick="S.memos.push({id:nid(S.memos),title:esc(mt.value),text:esc(mx.value)});sv();R()">${t("save")}</button></div>`:""}</div>`}
function N(){return`<div class=sec><h2>📢 ${t("not")}</h2>${[...S.notices].reverse().map(n=>`<div class=card style="margin-bottom:8px"><b>${n.title}</b> <small>${n.date}</small><p>${n.text}</p>${role=="a"?`<button onclick="S.notices=S.notices.filter(x=>x.id!=${n.id});sv();R()">🗑</button>`:""}</div>`).join("")}${role=="a"?`<div class=card><input id=nt placeholder="Title"><textarea id=nx placeholder="Text"></textarea><button class=pri onclick="S.notices.push({id:nid(S.notices),title:esc(nt.value),text:esc(nx.value),date:new Date().toISOString().slice(0,10)});sv();R()">+ Notice</button></div>`:""}</div>`}
function A(){return`<div class=sec><h2>⚙️ ${t("adm")}</h2><div class=grid><div class=card><b>👥 ${S.members.length}</b><br><button class=pri onclick="mf()">${t("add")}</button></div><div class=card><b>🎉 Add Event</b><input id=et placeholder="Title"><input id=ed type=date><button class=pri onclick="S.events.push({id:nid(S.events),title:esc(et.value),date:esc(ed.value)});sv();R()">+ Event</button></div><div class=card><b>📸 / 📢</b><br><button onclick="go('gallery')">${t("gal")}</button> <button onclick="go('notices')">${t("not")}</button> <button onclick="go('tree')">${t("tree")}</button></div><div class=card><b>🔑 Admin password / Family code</b><input id=ga type=password placeholder="New admin password (min 8)"><input id=gk placeholder="New family code (min 4)"><button class=pri onclick="gen()">Generate</button></div><div class=card><b>👤 Accounts</b>${S.users.map(u=>`<div class=row><span>${esc(u.u)} (${u.r})</span>${u.id!=me.id?`<button onclick="ru('${u.id}')">Reset pw</button><button onclick="du('${u.id}')">🗑</button>`:""}</div>`).join("")}</div></div></div>`}
try{const id=sessionStorage.getItem("c26s"),u=id=="admin"?adm():S.users.find(x=>x.id==id);if(u){me=u;role=u.r}}catch(e){}
R();
</script></body></html>
